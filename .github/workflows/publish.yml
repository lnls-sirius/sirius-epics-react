name: Epics-React library CD

on:
  release:
    types: [created]

jobs:
  npmjs_npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
      - name: Install 🔧
        run: pnpm install
      - name: Build 🏗️
        run: pnpm run build
      - name: NPM registry
        run: npm set registry https://registry.npmjs.org/
      - name: Login npmjs 🔓
        run: |
          echo https://registry.npmjs.org/> ./.npmrc
          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ./.npmrc
      - name: Publish
        run: npm publish --verbose --access public
        env:
          NPM_TOKEN: ${{ secrets.EPICS_REACT_NPMJS }}
