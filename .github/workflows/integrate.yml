name: Epics-React library CI
on:
  pull_request:
    branches: main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true

      - name: Build 🏗️
        run: pnpm run build
