name: Epics-React library CI

on:
  pull_request:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@master

      - name: Install 🔧
        run: pnpm install

      - name: Test 🚨
        run: pnpm test

      - name: Build 🏗️
        run: pnpm run build
